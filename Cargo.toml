[package]
name = "ussd-advanced"
version = "0.1.0"
edition = "2021"
authors = ["USSD Team"]
description = "Advanced USSD application with distributed session management, plugin architecture, and full observability"

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Web Framework & HTTP
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout", "compression-full"] }
hyper = { version = "1.1", features = ["full"] }

# gRPC
tonic = "0.11"
prost = "0.12"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }

# Redis for Session Management
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "streams"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"

# Metrics
prometheus = "0.13"

# Configuration
config = "0.14"
dotenvy = "0.15"
num_cpus = "1.16"

# UUID & Time
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# State Machine
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
regex = "1.10"

# Rate Limiting
governor = "0.6"

# Security
argon2 = "0.5"
jsonwebtoken = "9.2"

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"

# Plugin System (Dynamic Loading)
libloading = "0.8"

# Validation
validator = { version = "0.18", features = ["derive"] }

[dev-dependencies]
mockall = "0.12"
wiremock = "0.6"
criterion = "0.5"

[build-dependencies]
tonic-build = "0.11"

[[bin]]
name = "ussd-server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.bench]
inherits = "release"
